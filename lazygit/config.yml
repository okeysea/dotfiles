customCommands:
  - key: "c"
    context: "files"
    description: '変更をコミット [customCmd]'
    prompts:
      - type: "input"
        title: "Enter the Message"
        key: "Message"
        initialValue: "[refs: {{ .SelectedLocalBranch.Name }}] "
      - type: "confirm"
        title: "Commit"
        body: "Commit with the message '{{.Form.Message}}'. Is this okay?"
    command: "bash -c 'message=\"{{.Form.Message}}\";commit_message=\"$message\"; git commit -m \"$commit_message\"'"
    loadingText: "Commiting..."
